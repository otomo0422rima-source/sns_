<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>英検診断 — あなたの英語レベルを測ろう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- ── Google Analytics (GA4) ── -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z5BHE3YXGH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Z5BHE3YXGH');
</script>
</head>
<body>
<div id="app">

  <!-- ── HOME ── -->
  <div id="home" class="screen active">
    <div class="home-header">
      <div class="badge"><span class="badge-dot"></span>英語力診断 2026</div>
      <h1 class="home-title">英語レベル<br><span>診断テスト</span></h1>
      <p class="home-sub">1分で今の実力を確認しよう。<br>英検3級〜1級対応、5問から選べる。</p>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num">5</div><div class="stat-lbl">レベル</div></div>
        <div class="stat-card"><div class="stat-num">100問</div><div class="stat-lbl">収録数</div></div>
        <div class="stat-card"><div class="stat-num">2〜3分</div><div class="stat-lbl">所要時間</div></div>
      </div>
    </div>
    <div class="level-section">
      <div class="section-label">レベルを選ぶ</div>
      <div class="level-grid" id="levelGrid"></div>

      <!-- ▼トップ画面の広告エリア（A8ネット審査待ちのため一時停止中。審査通過後にコメントを外して再開）
      <div class="ad-recommend-card home-ad-card">
        <div class="ad-badge">PR</div>
        <div class="ad-title">英検対策に迷ったら</div>
        <p class="ad-text">
          プロ講師によるオンライン英会話で、着実にスコアアップ。今なら無料体験レッスン実施中。
        </p>
        <a href="https://example.com/affiliate/top-banner" class="ad-link-btn" target="_blank" rel="noopener sponsored">
          <span>無料体験を見る</span>
          <span class="ad-link-arrow">→</span>
        </a>
      </div>
      ▲トップ画面の広告エリア -->
    </div>
  </div>

  <!-- ── COUNT SELECT ── -->
  <div id="countSelect" class="screen">
    <div class="count-top">
      <div class="back-btn" onclick="goHome()">‹</div>
      <div class="count-header-title" id="countSelectLevelName"></div>
    </div>
    <div class="count-body">
      <div class="count-lead">何問で診断する？</div>
      <p class="count-sub">あとから何度でも挑戦できます。<br>まずは気軽に始めてみましょう。</p>
      <div class="count-grid" id="countGrid"></div>
    </div>
  </div>

  <!-- ── QUIZ ── -->
  <div id="quiz" class="screen">
    <div class="quiz-top">
      <div class="back-btn" onclick="goHome()">‹</div>
      <div class="quiz-progress-wrap">
        <div class="progress-meta">
          <span id="progressLabel">1 / 10</span>
          <span class="remaining-badge" id="remainingBadge">あと9問</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
      </div>
    </div>
    <div class="quiz-body" id="quizBody">
      <div class="level-tag" id="levelTag"></div>
      <div class="question-card" id="questionCard">
        <div class="question-type" id="questionType">単語問題</div>
        <div class="question-text" id="questionText"></div>
      </div>
      <div class="jp-hint-row" id="jpHintRow">
        <button class="jp-hint-btn" id="jpHintBtn" onclick="toggleJpHint()">
          <span id="jpHintBtnLabel">🇯🇵 訳を見る</span>
        </button>
        <p class="jp-hint-text" id="jpHintText"></p>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback-panel" id="feedbackPanel">
        <div class="feedback-emoji" id="feedbackEmoji"></div>
        <div class="feedback-title" id="feedbackTitle"></div>
        <div class="feedback-explain" id="feedbackExplain"></div>
        <button class="next-btn go" id="nextBtn" onclick="nextQuestion()">次の問題へ &rarr;</button>
      </div>
    </div>
  </div>

  <!-- ── RESULT ── -->
  <div id="result" class="screen">
    <div class="result-header">
      <div class="result-crown" id="resultCrown">🏆</div>
      <div class="result-level-tag" id="resultLevelTag"></div>
      <div class="score-ring" id="scoreRing">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"
            stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        </svg>
        <div class="score-ring-num">
          <span class="ring-pct" id="ringPct">0%</span>
          <span class="ring-of" id="ringOf">0/10</span>
        </div>
      </div>
    </div>
    <div class="result-body">
      <div class="diagnosis-card">
        <div class="diag-title">DIAGNOSIS</div>
        <div class="diag-level" id="diagLevel"></div>
        <div class="diag-desc" id="diagDesc"></div>
      </div>
      <div class="breakdown-grid">
        <div class="breakdown-item"><div class="bk-val s-great" id="bkCorrect">0</div><div class="bk-lbl">正解</div></div>
        <div class="breakdown-item"><div class="bk-val s-low" id="bkWrong">0</div><div class="bk-lbl">不正解</div></div>
        <div class="breakdown-item"><div class="bk-val" id="bkTime" style="color:#A78BFA">--</div><div class="bk-lbl">所要時間</div></div>
      </div>

      <!-- ▼おすすめ広告エリア（A8ネット審査待ちのため一時停止中。審査通過後にコメントを外して再開）
      <div class="ad-recommend-card" id="adRecommendCard">
        <div class="ad-badge">PR</div>
        <div class="ad-title">あなたにおすすめの英検対策</div>
        <p class="ad-text" id="adText">
          診断結果に合わせたおすすめを表示します。
        </p>
        <a href="#" class="ad-link-btn" id="adLinkBtn" target="_blank" rel="noopener sponsored">
          <span id="adLinkText">詳しく見る</span>
          <span class="ad-link-arrow">→</span>
        </a>
      </div>
      ▲おすすめ広告エリア -->

      <div class="share-section">
        <div class="share-title">SHARE YOUR RESULT</div>
        <div class="share-btns">
          <button class="share-btn x-btn" onclick="shareX()">𝕏 ポスト</button>
          <button class="share-btn ig-btn" onclick="shareIG()">📷 IG用テキスト</button>
        </div>
      </div>
      <div class="action-btns">
        <button class="retry-btn" onclick="retryQuiz()">🔄 もう一度挑戦する</button>
        <button class="home-btn" onclick="goHome()">レベル選択に戻る</button>
      </div>
    </div>
  </div>

</div>

<div class="confetti-container" id="confettiContainer"></div>
<div class="copy-toast" id="copyToast">📋 コピーしました！</div>
<div class="scroll-hint" id="scrollHint"><span class="scroll-hint-arrow">▼</span>下へスクロール</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
